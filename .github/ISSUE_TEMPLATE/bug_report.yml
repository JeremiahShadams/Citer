---
name: Bug report
description: Something broken? Tell me how to reproduce it.
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up -d --build
        2. POST /api/index with repo_url ...
        3. Ask "..." → saw ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      placeholder: Expected cited answer with file:lines; got ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste backend logs, SSE events, or screenshots.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Docker 26, Python 3.12, Node 20
---
